[package]
name = "ogiumacro"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
evdev = "0.13.2"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "0.15"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

